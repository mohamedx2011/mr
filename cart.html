<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سلة المشتريات - متجر ماري للكتب</title>
    <link rel="icon" type="image/png" href="./img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        :root {
            --bg-body: linear-gradient(135deg, #fef9f0 0%, #fdf0e0 100%);
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #2c1810 0%, #3d2317 100%);
            --text-primary: #2c1810;
            --text-secondary: #5a3a2a;
            --text-muted: #8b6b5a;
            --text-white: #ffffff;
            --color-primary: #c97e5a;
            --color-primary-dark: #b85c3a;
            --btn-gradient: linear-gradient(135deg, #c97e5a, #b85c3a);
            --btn-hover: #a04e2e;
            --border-color: #f0e4d8;
            --shadow-sm: 0 4px 15px rgba(44, 24, 16, 0.05);
            --shadow-md: 0 4px 20px rgba(44, 24, 16, 0.08);
            --available-bg: #27ae60;
            --remove-bg: #e74c3c;
            --checkout-bg: #27ae60;
            --instagram: #E4405F;
            --instagram-hover: #c1354d;
        }

        body.dark {
            --bg-body: linear-gradient(135deg, #12121a 0%, #1a1a2e 100%);
            --bg-card: #232338;
            --bg-header: linear-gradient(135deg, #0a0a12 0%, #12121a 100%);
            --text-primary: #f0f0f5;
            --text-secondary: #b8b8d0;
            --text-muted: #8888a0;
            --text-white: #ffffff;
            --color-primary: #e8955a;
            --color-primary-dark: #d47a45;
            --btn-gradient: linear-gradient(135deg, #e8955a, #d47a45);
            --btn-hover: #c06535;
            --border-color: #33334a;
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
            --available-bg: #2ecc71;
            --remove-bg: #e74c3c;
            --checkout-bg: #2ecc71;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-header);
            padding: 0.7rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }

        .logo h1 {
            font-size: 1rem;
            background: linear-gradient(135deg, #f0b27a, #c0392b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .theme-toggle, .instagram-link, .home-link {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 40px;
            padding: 0.35rem 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-white);
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover, .home-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .instagram-link {
            background: var(--instagram);
        }

        .instagram-link:hover {
            background: var(--instagram-hover);
            transform: translateY(-2px);
        }

        .cart-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cart-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .cart-card h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .cart-item-price {
            color: var(--color-primary);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .qty-btn:hover {
            transform: scale(1.05);
        }

        .qty-value {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .cart-item-total {
            font-weight: bold;
            min-width: 90px;
            text-align: left;
            color: var(--color-primary);
        }

        .remove-item {
            background: var(--remove-bg);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .remove-item:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .empty-cart {
            text-align: center;
            padding: 3rem;
        }

        .empty-cart i {
            font-size: 4rem;
            opacity: 0.5;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .empty-cart p {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .cart-summary {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .total-label {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .total-amount {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--color-primary);
        }

        .item-count {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .buttons-row {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .btn-primary {
            background: var(--btn-gradient);
            color: white;
        }

        .btn-primary:hover {
            background: var(--btn-hover);
        }

        .btn-success {
            background: var(--checkout-bg);
            color: white;
        }

        .btn-danger {
            background: var(--remove-bg);
            color: white;
        }

        .btn-secondary {
            background: #3498db;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .close-modal:hover {
            transform: rotate(90deg);
            color: var(--color-primary);
        }

        .invoice-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed var(--border-color);
        }

        .invoice-logo {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            margin-bottom: 0.5rem;
        }

        .invoice-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .invoice-store {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .invoice-items {
            margin: 1rem 0;
        }

        .invoice-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .invoice-total {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--border-color);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .invoice-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .print-btn {
            background: var(--btn-gradient);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
            font-size: 1rem;
        }

        .print-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .cart-card {
                padding: 1rem;
            }
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
            .cart-item-total {
                text-align: center;
            }
            .buttons-row {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
            .header-actions .instagram-link span,
            .header-actions .home-link span {
                display: none;
            }
            .cart-card h1 {
                font-size: 1.2rem;
            }
            .total-amount {
                font-size: 1.3rem;
            }
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100px); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <a href="./" class="logo">
            <img src="./img.png" alt="متجر ماري للكتب" class="logo-img" onerror="this.style.display='none';">
            <h1>📚 متجر ماري للكتب</h1>
        </a>
        <div class="header-actions">
            <a href="https://www.instagram.com/marie__books_/" target="_blank" class="instagram-link">
                <i class="fab fa-instagram"></i>
                <span>إنستغرام</span>
            </a>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
                <span>ليلي</span>
            </button>
            <a href="./" class="home-link">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
        </div>
    </div>
</div>

<div class="cart-container">
    <div class="cart-card">
        <h1><i class="fas fa-shopping-cart"></i> سلة المشتريات</h1>
        <div id="cartItemsList"></div>
        <div id="cartSummary"></div>
        <div class="buttons-row">
            <a href="./" class="btn btn-primary">↩️ متابعة التسوق</a>
            <button id="checkoutCartBtn" class="btn btn-success">✅ إتمام الشراء</button>
            <button id="invoiceBtn" class="btn btn-secondary">📄 عمل فاتورة</button>
            <button id="clearCartBtn" class="btn btn-danger">🗑️ تفريغ السلة</button>
        </div>
    </div>
</div>

<div id="invoiceModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <div id="invoiceContent"></div>
        <button class="print-btn" id="printInvoice"><i class="fas fa-print"></i> طباعة الفاتورة</button>
    </div>
</div>

<script>
    function getCart() {
        try {
            const cartJson = localStorage.getItem('bookCart');
            if (cartJson) {
                return JSON.parse(cartJson);
            }
        } catch(e) {
            console.error('خطأ في قراءة السلة:', e);
        }
        return [];
    }

    function saveCart(cart) {
        localStorage.setItem('bookCart', JSON.stringify(cart));
        updateCartCount();
    }

    function updateQuantity(bookId, newQuantity) {
        if (newQuantity < 1) {
            removeFromCart(bookId);
            return;
        }
        
        let cart = getCart();
        const itemIndex = cart.findIndex(i => i.id === bookId);
        
        if (itemIndex !== -1) {
            cart[itemIndex].quantity = newQuantity;
            saveCart(cart);
            displayCart();
            showNotification('📖 تم تحديث الكمية');
        }
    }

    function removeFromCart(bookId) {
        let cart = getCart();
        const book = cart.find(i => i.id === bookId);
        cart = cart.filter(i => i.id !== bookId);
        saveCart(cart);
        displayCart();
        if (book) {
            showNotification(`🗑️ تم إزالة "${book.title}" من السلة`);
        }
    }

    function clearCart() {
        if (confirm('هل أنت متأكد من تفريغ السلة بالكامل؟')) {
            saveCart([]);
            displayCart();
            showNotification('🗑️ تم تفريغ السلة');
        }
    }

    function getCartTotal() {
        return getCart().reduce((t, i) => t + (i.price * i.quantity), 0);
    }

    function getCartItemCount() {
        return getCart().reduce((c, i) => c + i.quantity, 0);
    }

    function updateCartCount() {
        const count = getCartItemCount();
        const cartCountElements = document.querySelectorAll('#cartCount');
        cartCountElements.forEach(el => {
            if (el) el.textContent = count;
        });
    }

    function showNotification(msg) {
        const n = document.createElement('div');
        n.textContent = msg;
        n.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--available-bg);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 3000;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s ease;
            direction: rtl;
        `;
        document.body.appendChild(n);
        setTimeout(() => {
            n.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => n.remove(), 300);
        }, 2500);
    }

    function displayCart() {
        const cart = getCart();
        const cartItemsDiv = document.getElementById('cartItemsList');
        const cartSummary = document.getElementById('cartSummary');
        
        if (!cartItemsDiv) return;
        
        if (cart.length === 0) {
            cartItemsDiv.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-basket"></i>
                    <p>سلة المشتريات فارغة</p>
                    <a href="./" class="btn btn-primary" style="display: inline-block; text-decoration: none;">🛍️ تسوق الآن</a>
                </div>
            `;
            cartSummary.innerHTML = '';
            return;
        }
        
        let total = 0;
        cartItemsDiv.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${escapeHtml(item.title)}</div>
                        <div class="cart-item-price">${item.price} دج</div>
                    </div>
                    <div class="cart-item-quantity">
                        <span>الكمية:</span>
                        <button class="qty-btn qty-decrease" data-id="${item.id}" style="background: #e74c3c; color: white;">-</button>
                        <span class="qty-value">${item.quantity}</span>
                        <button class="qty-btn qty-increase" data-id="${item.id}" style="background: #27ae60; color: white;">+</button>
                    </div>
                    <div class="cart-item-total">${itemTotal} دج</div>
                    <button class="remove-item" data-id="${item.id}"><i class="fas fa-trash"></i> إزالة</button>
                </div>
            `;
        }).join('');
        
        cartSummary.innerHTML = `
            <div class="cart-summary">
                <div class="total-row">
                    <span class="total-label">المجموع الكلي:</span>
                    <span class="total-amount">${total} دج</span>
                </div>
                <div class="item-count">عدد العناصر: ${getCartItemCount()} كتاب</div>
            </div>
        `;
        
        document.querySelectorAll('.qty-decrease').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                const cart = getCart();
                const item = cart.find(i => i.id === id);
                if (item && item.quantity > 1) {
                    updateQuantity(id, item.quantity - 1);
                } else if (item) {
                    removeFromCart(id);
                }
            };
        });
        
        document.querySelectorAll('.qty-increase').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                const cart = getCart();
                const item = cart.find(i => i.id === id);
                if (item) {
                    updateQuantity(id, item.quantity + 1);
                }
            };
        });
        
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.onclick = function() {
                removeFromCart(parseInt(this.dataset.id));
            };
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function generateInvoice() {
        const cart = getCart();
        if (cart.length === 0) {
            showNotification('لا يمكن عمل فاتورة والسلة فارغة');
            return null;
        }
        const now = new Date();
        const invoiceNumber = 'INV-' + now.getFullYear() + (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0') + '-' + Math.floor(Math.random() * 10000);
        const date = now.toLocaleDateString('ar-EG');
        const time = now.toLocaleTimeString('ar-EG');
        const total = getCartTotal();
        return { cart, invoiceNumber, date, time, total };
    }

    function showInvoiceModal() {
        const data = generateInvoice();
        if (!data) return;
        const { cart, invoiceNumber, date, time, total } = data;
        const itemsHtml = cart.map(item => `
            <div class="invoice-item">
                <span>${escapeHtml(item.title)} (×${item.quantity})</span>
                <span>${item.price * item.quantity} دج</span>
            </div>
        `).join('');
        
        document.getElementById('invoiceContent').innerHTML = `
            <div class="invoice-header">
                <img src="./img.png" alt="شعار المتجر" class="invoice-logo" onerror="this.style.display='none';">
                <div class="invoice-title">📚 متجر ماري للكتب</div>
                <div class="invoice-store">Mary's Bookstore</div>
                <div style="margin-top: 5px;">فاتورة شراء</div>
            </div>
            <div style="margin-bottom: 1rem; font-size: 0.8rem;">
                <div><strong>رقم الفاتورة:</strong> ${invoiceNumber}</div>
                <div><strong>التاريخ:</strong> ${date}</div>
                <div><strong>الوقت:</strong> ${time}</div>
            </div>
            <div class="invoice-items">${itemsHtml}</div>
            <div class="invoice-total">
                <span>المجموع الكلي:</span>
                <span>${total} دج</span>
            </div>
            <div class="invoice-footer">
                <i class="fab fa-instagram"></i> marie__books_<br>
                شكراً لتسوقكم مع متجر ماري للكتب 📚
            </div>
        `;
        document.getElementById('invoiceModal').style.display = 'flex';
    }

    function printInvoice() {
        const content = document.getElementById('invoiceContent').innerHTML;
        const win = window.open('', '_blank');
        win.document.write(`
            <html dir="rtl">
            <head>
                <title>فاتورة - متجر ماري للكتب</title>
                <meta charset="UTF-8">
                <style>
                    body {
                        font-family: 'Tajawal', sans-serif;
                        padding: 20px;
                        direction: rtl;
                        background: white;
                    }
                    .invoice-header {
                        text-align: center;
                        margin-bottom: 20px;
                    }
                    .invoice-logo {
                        width: 60px;
                        height: 60px;
                        border-radius: 15px;
                    }
                    .invoice-title {
                        font-size: 1.3rem;
                        font-weight: bold;
                        color: #2c1810;
                    }
                    .invoice-store {
                        color: #8b6b5a;
                        font-size: 0.8rem;
                    }
                    .invoice-item {
                        display: flex;
                        justify-content: space-between;
                        padding: 8px 0;
                        border-bottom: 1px solid #f0e4d8;
                        color: #2c1810;
                    }
                    .invoice-total {
                        display: flex;
                        justify-content: space-between;
                        margin-top: 15px;
                        padding-top: 10px;
                        border-top: 2px solid #c97e5a;
                        font-weight: bold;
                        font-size: 1.1rem;
                        color: #2c1810;
                    }
                    .invoice-footer {
                        text-align: center;
                        margin-top: 20px;
                        font-size: 12px;
                        color: #8b6b5a;
                    }
                </style>
            </head>
            <body>${content}</body>
            </html>
        `);
        win.document.close();
        win.print();
        win.close();
    }

    function checkout() {
        const cart = getCart();
        if (cart.length === 0) {
            showNotification('السلة فارغة! أضف بعض الكتب أولاً.');
            return;
        }
        const total = getCartTotal();
        const itemCount = getCartItemCount();
        showNotification(`شكراً لتسوقك! تم شراء ${itemCount} كتب بمبلغ ${total} دج. سيتم التواصل معك قريباً 💙`);
        saveCart([]);
        displayCart();
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const themeBtn = document.getElementById('themeToggle');
        
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
        } else if (savedTheme === 'light') {
            document.body.classList.remove('dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                document.body.classList.add('dark');
                if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
            } else {
                document.body.classList.remove('dark');
                if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
            }
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains('dark');
        const themeBtn = document.getElementById('themeToggle');
        
        if (isDark) {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
            showNotification('☀️ تم التبديل إلى الوضع النهاري');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
            showNotification('🌙 تم التبديل إلى الوضع الليلي');
        }
    }

    function init() {
        initTheme();
        displayCart();
        updateCartCount();
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
        
        const checkoutBtn = document.getElementById('checkoutCartBtn');
        if (checkoutBtn) checkoutBtn.addEventListener('click', checkout);
        
        const clearBtn = document.getElementById('clearCartBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearCart);
        
        const invoiceBtn = document.getElementById('invoiceBtn');
        if (invoiceBtn) invoiceBtn.addEventListener('click', showInvoiceModal);
        
        const closeModal = document.getElementById('closeModal');
        if (closeModal) closeModal.addEventListener('click', function() {
            document.getElementById('invoiceModal').style.display = 'none';
        });
        
        const printBtn = document.getElementById('printInvoice');
        if (printBtn) printBtn.addEventListener('click', printInvoice);
        
        const modal = document.getElementById('invoiceModal');
        if (modal) {
            window.addEventListener('click', function(e) {
                if (e.target === modal) modal.style.display = 'none';
            });
        }
        
        window.addEventListener('storage', function(e) {
            if (e.key === 'bookCart') {
                displayCart();
                updateCartCount();
            }
        });
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
