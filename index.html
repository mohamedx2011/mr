<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>متجر ماري للكتب - Mary's Bookstore</title>
    <link rel="icon" type="image/png" href="./img.png">
    <link rel="apple-touch-icon" href="./img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        :root {
            --bg-body: linear-gradient(135deg, #fef9f0 0%, #fdf0e0 100%);
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-header: linear-gradient(135deg, #2c1810 0%, #3d2317 100%);
            --text-primary: #2c1810;
            --text-secondary: #5a3a2a;
            --text-muted: #8b6b5a;
            --text-white: #ffffff;
            --color-primary: #c97e5a;
            --color-primary-dark: #b85c3a;
            --btn-gradient: linear-gradient(135deg, #c97e5a, #b85c3a);
            --btn-hover: #a04e2e;
            --border-color: #f0e4d8;
            --shadow-sm: 0 4px 15px rgba(44, 24, 16, 0.05);
            --shadow-md: 0 4px 20px rgba(44, 24, 16, 0.08);
            --shadow-lg: 0 8px 30px rgba(44, 24, 16, 0.12);
            --available-bg: #27ae60;
            --outofstock-bg: #e74c3c;
            --category-hover: #fdf0e4;
            --category-active: linear-gradient(135deg, #c97e5a, #b85c3a);
            --overlay-bg: rgba(44, 24, 16, 0.5);
            --fab-bg: #c97e5a;
            --instagram: #E4405F;
            --instagram-hover: #c1354d;
            --search-bg: #ffffff;
            --search-border: #f0e4d8;
        }

        body.dark {
            --bg-body: linear-gradient(135deg, #12121a 0%, #1a1a2e 100%);
            --bg-card: #232338;
            --bg-sidebar: #232338;
            --bg-header: linear-gradient(135deg, #0a0a12 0%, #12121a 100%);
            --text-primary: #f0f0f5;
            --text-secondary: #b8b8d0;
            --text-muted: #8888a0;
            --text-white: #ffffff;
            --color-primary: #e8955a;
            --color-primary-dark: #d47a45;
            --btn-gradient: linear-gradient(135deg, #e8955a, #d47a45);
            --btn-hover: #c06535;
            --border-color: #33334a;
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.3);
            --available-bg: #2ecc71;
            --outofstock-bg: #e74c3c;
            --category-hover: #2a2a3e;
            --category-active: linear-gradient(135deg, #e8955a, #d47a45);
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --fab-bg: #e8955a;
            --instagram: #E4405F;
            --instagram-hover: #c1354d;
            --search-bg: #232338;
            --search-border: #33334a;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        .header {
            background: var(--bg-header);
            padding: 0.7rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f0b27a, #c0392b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text p {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .theme-toggle, .instagram-link, .cart-link {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 40px;
            padding: 0.35rem 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-white);
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover, .cart-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .instagram-link {
            background: var(--instagram);
        }

        .instagram-link:hover {
            background: var(--instagram-hover);
            transform: translateY(-2px);
        }

        .cart-link {
            position: relative;
        }

        .cart-count {
            background: var(--color-primary);
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
            color: white;
        }

        .search-container {
            max-width: 1400px;
            margin: 1rem auto 0 auto;
            padding: 0 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border-radius: 50px;
            border: 1px solid var(--search-border);
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .search-box:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary);
        }

        .search-icon {
            color: var(--text-muted);
            font-size: 1rem;
            margin-left: 0.5rem;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.9rem;
            padding: 0.5rem 0;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            display: none;
        }

        .search-clear:hover {
            color: var(--color-primary);
        }

        .main-wrapper {
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .container {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .sidebar {
            background: var(--bg-sidebar);
            border-radius: 20px;
            padding: 1.3rem;
            position: sticky;
            top: 85px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            height: fit-content;
            border: 1px solid var(--border-color);
        }

        .sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            border-right: 3px solid var(--color-primary);
            padding-right: 10px;
            color: var(--text-primary);
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .category-item {
            padding: 0.7rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        .category-item i {
            width: 22px;
            font-size: 0.95rem;
        }

        .category-item:hover {
            background: var(--category-hover);
            color: var(--color-primary);
            transform: translateX(-4px);
        }

        .category-item.active {
            background: var(--category-active);
            color: white;
        }

        .fab-menu {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--fab-bg);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .fab-menu:hover {
            transform: scale(1.05);
            background: var(--color-primary-dark);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay-bg);
            z-index: 1100;
            backdrop-filter: blur(4px);
        }

        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: var(--bg-sidebar);
            z-index: 1101;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            padding: 1.5rem;
            overflow-y: auto;
            border-left: 1px solid var(--border-color);
        }

        .mobile-sidebar.open {
            right: 0;
        }

        .mobile-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .mobile-sidebar-header h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .close-sidebar-btn:hover {
            transform: rotate(90deg);
            color: var(--color-primary);
        }

        .mobile-category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .mobile-category-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .mobile-category-item i {
            width: 24px;
        }

        .mobile-category-item:hover {
            background: var(--category-hover);
            color: var(--color-primary);
        }

        .mobile-category-item.active {
            background: var(--category-active);
            color: white;
        }

        .books-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            color: var(--text-primary);
            border-right: 3px solid var(--color-primary);
            padding-right: 12px;
        }

        /* شبكة الكتب - على الكمبيوتر 3-4 أعمدة */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .book-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
            border: 1px solid var(--border-color);
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
        }

        .book-cover {
            height: 240px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .book-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .book-card:hover .book-cover-img {
            transform: scale(1.05);
        }

        .book-status {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
            z-index: 1;
            backdrop-filter: blur(4px);
        }

        .status-available {
            background: var(--available-bg);
        }

        .status-out {
            background: var(--outofstock-bg);
        }

        .book-info {
            padding: 1rem;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .book-author {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .book-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--color-primary);
            margin: 8px 0;
        }

        .book-summary {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 8px 0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 8px 12px;
            background: var(--btn-gradient);
            border: none;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .add-to-cart-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background: var(--btn-hover);
        }

        .add-to-cart-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ============================================ */
        /* تصميم الهاتف - عرض كتابين في السطر */
        /* ============================================ */
        @media (max-width: 768px) {
            .fab-menu {
                display: flex;
            }
            .container {
                display: block;
            }
            .sidebar {
                display: none;
            }
            .main-wrapper {
                margin: 1rem auto;
                padding: 0 0.8rem;
                padding-bottom: 80px;
            }
            
            /* عرض كتابين في السطر على الهاتف */
            .books-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            
            .book-cover {
                height: 160px;
            }
            
            .book-title {
                font-size: 0.85rem;
            }
            
            .book-author {
                font-size: 0.7rem;
            }
            
            .book-price {
                font-size: 0.9rem;
            }
            
            .book-summary {
                display: none;
            }
            
            .add-to-cart-btn {
                padding: 6px 8px;
                font-size: 0.7rem;
            }
            
            .book-info {
                padding: 0.6rem;
            }
            
            .books-section h2 {
                font-size: 1.2rem;
            }
            .search-container {
                margin: 0.8rem auto 0 auto;
                padding: 0 0.8rem;
            }
        }

        /* للشاشات الصغيرة جداً (أقل من 480px) */
        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }
            
            .book-cover {
                height: 140px;
            }
            
            .book-title {
                font-size: 0.75rem;
            }
            
            .book-author {
                font-size: 0.6rem;
            }
            
            .book-price {
                font-size: 0.8rem;
            }
            
            .add-to-cart-btn {
                padding: 5px 6px;
                font-size: 0.65rem;
            }
            
            .book-info {
                padding: 0.5rem;
            }
            
            .theme-toggle span, 
            .instagram-link span, 
            .cart-link span {
                display: none;
            }
            
            .fab-menu {
                width: 50px;
                height: 50px;
                bottom: 20px;
                left: 20px;
            }
            
            .logo-text p {
                display: none;
            }
            
            .logo-img {
                width: 32px;
                height: 32px;
            }
            
            .logo-text h1 {
                font-size: 0.85rem;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-card {
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100px); opacity: 0; }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary-dark);
        }

        body.sidebar-open {
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <a href="./" class="logo">
            <img src="./img.png" alt="متجر ماري للكتب" class="logo-img" onerror="this.style.display='none';">
            <div class="logo-text">
                <h1>📚 متجر ماري للكتب</h1>
                <p>Mary's Bookstore</p>
            </div>
        </a>
        <div class="header-actions">
            <a href="https://www.instagram.com/marie__books_/" target="_blank" class="instagram-link">
                <i class="fab fa-instagram"></i>
                <span>إنستغرام</span>
            </a>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
                <span>ليلي</span>
            </button>
            <a href="./cart.html" class="cart-link">
                <i class="fas fa-shopping-cart"></i>
                <span>السلة</span>
                <span class="cart-count" id="cartCount">0</span>
            </a>
        </div>
    </div>
</div>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن كتاب... (بالاسم أو المؤلف)">
        <button class="search-clear" id="searchClear">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<div class="main-wrapper">
    <div class="container">
        <aside class="sidebar">
            <h3><i class="fas fa-tags"></i> أنواع الكتب</h3>
            <ul class="category-list" id="categoryList">
                <li class="category-item active" data-category="all"><i class="fas fa-book"></i> جميع الكتب</li>
                <li class="category-item" data-category="religious"><i class="fas fa-mosque"></i> دينية</li>
                <li class="category-item" data-category="romance"><i class="fas fa-heart"></i> رومانسية</li>
                <li class="category-item" data-category="fiction"><i class="fas fa-dragon"></i> أدب خيالي</li>
                <li class="category-item" data-category="development"><i class="fas fa-chart-line"></i> تطوير ذات</li>
                <li class="category-item" data-category="horror"><i class="fas fa-skull"></i> رعب</li>
                <li class="category-item" data-category="novels"><i class="fas fa-book-open"></i> روايات</li>
            </ul>
        </aside>

        <main class="books-section">
            <h2 id="sectionTitle">جميع الكتب</h2>
            <div class="books-grid" id="booksGrid"></div>
        </main>
    </div>
</div>

<button class="fab-menu" id="fabMenuBtn">
    <i class="fas fa-bars"></i>
</button>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="mobile-sidebar" id="mobileSidebar">
    <div class="mobile-sidebar-header">
        <h3><i class="fas fa-tags"></i> أنواع الكتب</h3>
        <button class="close-sidebar-btn" id="closeSidebarBtn">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <ul class="mobile-category-list" id="mobileCategoryList">
        <li class="mobile-category-item active" data-category="all"><i class="fas fa-book"></i> جميع الكتب</li>
        <li class="mobile-category-item" data-category="religious"><i class="fas fa-mosque"></i> دينية</li>
        <li class="mobile-category-item" data-category="romance"><i class="fas fa-heart"></i> رومانسية</li>
        <li class="mobile-category-item" data-category="fiction"><i class="fas fa-dragon"></i> أدب خيالي</li>
        <li class="mobile-category-item" data-category="development"><i class="fas fa-chart-line"></i> تطوير ذات</li>
        <li class="mobile-category-item" data-category="horror"><i class="fas fa-skull"></i> رعب</li>
        <li class="mobile-category-item" data-category="novels"><i class="fas fa-book-open"></i> روايات</li>
    </ul>
</div>

<script>
    const books = [
        { id: 1, title: "وشم أزرق", author: "شيماء سمير كامل عاشور", category: "novels", price: 1500, available: true, summary: "في قلب الظلال، حيث تتداخل الوَحْدةُ مع الأمل، تنسج رواية عن الشفاء والتحوّل. تلتقي صفا، الإخصائية المعالجة بالفن، بمجموعة من النساء في بيت حكي ليبدأن معًا رحلة علاجية فريدة.", coverImage: "./img.png" },
        { id: 2, title: "وردية الليل", author: "ستيفن كينغ", category: "horror", price: 2800, available: true, summary: "مجموعة قصصية من أشهر قصص الرعب القصيرة، تحول كثير منها لأفلام سينمائية وتليفزيونية.", coverImage: "./img.png" },
        { id: 3, title: "مينوس", author: "آني. إم جي. شميت", category: "fiction", price: 1500, available: false, summary: "تيبل صحفي على وشك فقدان وظيفته ما لم يجد أخبارًا تستحق الكتابة عنها.", coverImage: "./img.png" },
        { id: 4, title: "موسم الهجرة الى الشمال", author: "الطيب صالح", category: "novels", price: 1100, available: true, summary: "رواية علامة فارقة في الأدب العربي تدور حول الصراع الثقافي والنفسي بين الشرق والغرب.", coverImage: "./img.png" },
        { id: 5, title: "مقتل الكومنداتور", author: "هاروكي موراكامي", category: "fiction", price: 6000, available: true, summary: "رواية حول قوة الفن البناء وقوة العنف الهادمة.", coverImage: "./img.png" },
        { id: 6, title: "مانسفيلد بارك", author: "جين اوستن", category: "romance", price: 2000, available: false, summary: "رواية واقعية تروي قصة فاني برايس، الفتاة الفقيرة التي تنتقل للعيش مع أقاربها الأثرياء.", coverImage: "./img.png" },
        { id: 7, title: "لماذا ننام", author: "ماثيو ووكر", category: "development", price: 2800, available: true, summary: "كتاب علمي شهير عن النوم من تأليف عالم الأعصاب ماثيو ووكر.", coverImage: "./img.png" },
        { id: 8, title: "كاري", author: "ستيفن كينغ", category: "horror", price: 1800, available: true, summary: "الرواية الأولى لستيفن كينغ، عن التنمر والقدرات الخارقة.", coverImage: "./img.png" },
        { id: 9, title: "قناع بلون السماء", author: "باسم خندقجي", category: "novels", price: 2600, available: false, summary: "رواية فلسطينية حائزة على الجائزة العالمية للرواية العربية (بوكر) 2024.", coverImage: "./img.png" },
        { id: 10, title: "شبيك لبيك الجزء 3", author: "دينا محمد يحيى", category: "fiction", price: 1600, available: true, summary: "عالم يمكنك فيه بيع وشراء الأمنيات.", coverImage: "./img.png" },
        { id: 11, title: "الأثر", author: "طارق عمران", category: "development", price: 2200, available: true, summary: "كتاب ملهم عن تطوير الذات وتحقيق الأهداف.", coverImage: "./img.png" },
        { id: 12, title: "أيام الله", author: "أحمد خيري", category: "religious", price: 1800, available: true, summary: "رحلة روحانية في فهم أسماء الله الحسنى.", coverImage: "./img.png" }
    ];

    // ============================================
    // دوال السلة
    // ============================================
    function getCart() {
        try {
            const cartJson = localStorage.getItem('bookCart');
            if (cartJson) {
                return JSON.parse(cartJson);
            }
        } catch(e) {
            console.error('خطأ في قراءة السلة:', e);
        }
        return [];
    }

    function saveCart(cart) {
        localStorage.setItem('bookCart', JSON.stringify(cart));
        updateCartCount();
        window.dispatchEvent(new StorageEvent('storage', { key: 'bookCart', newValue: JSON.stringify(cart) }));
    }

    function addToCart(bookId) {
        const book = books.find(b => b.id === bookId);
        if (!book) {
            showNotification('الكتاب غير موجود!', 'error');
            return false;
        }
        if (!book.available) {
            showNotification('عذراً، هذا الكتاب غير متوفر حالياً!', 'error');
            return false;
        }
        
        let cart = getCart();
        const existingItem = cart.find(item => item.id === bookId);
        
        if (existingItem) {
            existingItem.quantity += 1;
            showNotification(`📖 تم زيادة كمية "${book.title}" إلى ${existingItem.quantity}`);
        } else {
            cart.push({
                id: book.id,
                title: book.title,
                price: book.price,
                quantity: 1,
                available: book.available
            });
            showNotification(`📖 تم إضافة "${book.title}" إلى السلة`);
        }
        
        saveCart(cart);
        return true;
    }

    function getCartItemCount() {
        const cart = getCart();
        return cart.reduce((count, item) => count + item.quantity, 0);
    }

    function updateCartCount() {
        const count = getCartItemCount();
        const cartCountElements = document.querySelectorAll('#cartCount');
        cartCountElements.forEach(el => {
            if (el) el.textContent = count;
        });
    }

    function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.textContent = message;
        notification.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: ${type === 'success' ? 'var(--available-bg)' : '#e74c3c'};
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 3000;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s ease;
            direction: rtl;
        `;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notification.remove(), 300);
        }, 2500);
    }

    // ============================================
    // البحث والتصفية
    // ============================================
    let currentCategory = 'all';
    let searchQuery = '';

    function filterBooks() {
        let filtered = [...books];
        if (currentCategory !== 'all') {
            filtered = filtered.filter(book => book.category === currentCategory);
        }
        if (searchQuery.trim() !== '') {
            const query = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
        }
        return filtered;
    }

    function renderBooks() {
        const filtered = filterBooks();
        const grid = document.getElementById('booksGrid');
        
        if (!grid) return;
        
        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-book-open"></i>
                    <p>لا توجد كتب تطابق بحثك</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem;">جرب البحث بكلمة مختلفة أو تصفح التصنيفات</p>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = filtered.map(book => `
            <a href="./book-details.html?id=${book.id}" class="book-card">
                <div class="book-cover">
                    <img src="${book.coverImage}" alt="${book.title}" class="book-cover-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <i class="fas fa-book-open" style="display: none; font-size: 3rem;"></i>
                    <span class="book-status ${book.available ? 'status-available' : 'status-out'}">
                        ${book.available ? 'متوفر' : 'نفدت الكمية'}
                    </span>
                </div>
                <div class="book-info">
                    <h3 class="book-title">${escapeHtml(book.title)}</h3>
                    <p class="book-author">✍️ ${escapeHtml(book.author)}</p>
                    <p class="book-summary">${escapeHtml(book.summary.substring(0, 80))}${book.summary.length > 80 ? '...' : ''}</p>
                    <div class="book-price">${book.price} دج</div>
                    <button class="add-to-cart-btn" onclick="event.preventDefault(); event.stopPropagation(); addToCart(${book.id});" ${!book.available ? 'disabled' : ''}>
                        ${book.available ? '🛒 أضف إلى السلة' : '❌ غير متوفر'}
                    </button>
                </div>
            </a>
        `).join('');
        
        document.querySelectorAll('.book-cover-img').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const icon = this.nextElementSibling;
                if (icon) icon.style.display = 'flex';
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function updateSectionTitle() {
        const title = document.getElementById('sectionTitle');
        if (!title) return;
        
        let text = '';
        if (searchQuery && currentCategory !== 'all') {
            const categoryNames = {
                'all': 'جميع الكتب', 'religious': 'دينية', 'romance': 'رومانسية',
                'fiction': 'أدب خيالي', 'development': 'تطوير ذات', 'horror': 'رعب', 'novels': 'روايات'
            };
            text = `نتائج بحث "${searchQuery}" في ${categoryNames[currentCategory]}`;
        } else if (searchQuery) {
            text = `نتائج البحث عن "${searchQuery}"`;
        } else if (currentCategory !== 'all') {
            const categoryNames = {
                'religious': 'دينية', 'romance': 'رومانسية', 'fiction': 'أدب خيالي',
                'development': 'تطوير ذات', 'horror': 'رعب', 'novels': 'روايات'
            };
            text = categoryNames[currentCategory];
        } else {
            text = 'جميع الكتب';
        }
        title.textContent = text;
    }

    function setupCategories() {
        const cats = document.querySelectorAll('#categoryList .category-item');
        const mobileCats = document.querySelectorAll('#mobileCategoryList .mobile-category-item');
        
        function updateActive(cat) {
            cats.forEach(c => {
                if (c.dataset.category === cat) c.classList.add('active');
                else c.classList.remove('active');
            });
            mobileCats.forEach(c => {
                if (c.dataset.category === cat) c.classList.add('active');
                else c.classList.remove('active');
            });
        }
        
        function handleClick(cat) {
            currentCategory = cat;
            updateActive(cat);
            renderBooks();
            updateSectionTitle();
            closeMobileSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        cats.forEach(c => c.addEventListener('click', () => handleClick(c.dataset.category)));
        mobileCats.forEach(c => c.addEventListener('click', () => handleClick(c.dataset.category)));
    }

    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        
        if (!searchInput) return;
        
        function handleSearch() {
            searchQuery = searchInput.value;
            if (searchClear) {
                searchClear.style.display = searchQuery ? 'block' : 'none';
            }
            renderBooks();
            updateSectionTitle();
        }
        
        searchInput.addEventListener('input', handleSearch);
        
        if (searchClear) {
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                searchQuery = '';
                searchClear.style.display = 'none';
                renderBooks();
                updateSectionTitle();
                searchInput.focus();
            });
        }
    }

    function openMobileSidebar() {
        const mobileSidebar = document.getElementById('mobileSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (mobileSidebar) mobileSidebar.classList.add('open');
        if (overlay) overlay.style.display = 'block';
        document.body.classList.add('sidebar-open');
    }

    function closeMobileSidebar() {
        const mobileSidebar = document.getElementById('mobileSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (mobileSidebar) mobileSidebar.classList.remove('open');
        if (overlay) overlay.style.display = 'none';
        document.body.classList.remove('sidebar-open');
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const themeBtn = document.getElementById('themeToggle');
        
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
        } else if (savedTheme === 'light') {
            document.body.classList.remove('dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                document.body.classList.add('dark');
                if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
            } else {
                document.body.classList.remove('dark');
                if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
            }
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains('dark');
        const themeBtn = document.getElementById('themeToggle');
        
        if (isDark) {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i><span>ليلي</span>';
            showNotification('☀️ تم التبديل إلى الوضع النهاري');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i><span>نهاري</span>';
            showNotification('🌙 تم التبديل إلى الوضع الليلي');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        initTheme();
        setupCategories();
        setupSearch();
        renderBooks();
        updateCartCount();
        
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('fabMenuBtn').addEventListener('click', openMobileSidebar);
        document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);
        
        window.addEventListener('storage', (e) => {
            if (e.key === 'bookCart') updateCartCount();
        });
    });
</script>
</body>
</html>
